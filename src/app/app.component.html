<div class="container">
  <h1>Bootstrap Components</h1>

  <div class="card">
    <div class="card-header">Tag Input Component</div>
    <div class="card-body">
      <div class="d-flex">
        <div class="form-group">
          <label class="form-label">Select Type:</label>
          <select class="form-select" [(ngModel)]="selectedType">
            @for (item of typeList; track item) {
              <option>{{ item }}</option>
            }
          </select>
        </div>
      </div>
      <div class="d-flex mt-4 mb-4">
        <div class="form-group">
          <label class="form-label">Tag Input:</label>
          <app-tag-input
            [(ngModel)]="tagList"
            [type]="selectedType"
          ></app-tag-input>
        </div>
      </div>
      <h2>Your selected Tags:</h2>
      <div class="d-flex">
        <ul>
          @for (tag of tagList; track tag) {
            <li>{{ tag }}</li>
          }
        </ul>
      </div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header">Multi Select Component</div>
    <div class="card-body">
      <app-multi-select [items]="languages" [(ngModel)]="selectedLanguages" [type]="selectedType"
                        placeholder="Pick languages"></app-multi-select>
      <p class="mt-3 mb-0">Selected: {{ selectedLanguages.join(', ') || 'none' }}</p>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header">Reactive Form</div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label class="form-label">Tags</label>
        <app-tag-input formControlName="tags" [type]="selectedType"></app-tag-input>
        <label class="form-label mt-3">Languages</label>
        <app-multi-select formControlName="languages" [items]="languages" [type]="selectedType"></app-multi-select>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Submit</button>
          <button class="btn btn-outline-secondary" type="button"
                  (click)="form.controls.tags.disabled ? form.enable() : form.disable()">Toggle disabled</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card mt-4 mb-4">
    <div class="card-header">Toast Service</div>
    <div class="card-body d-flex gap-2">
      <button class="btn btn-success" (click)="toast.success('Saved successfully', { title: 'Success' })">Success</button>
      <button class="btn btn-info" (click)="toast.info('Heads up')">Info</button>
      <button class="btn btn-warning" (click)="toast.warning('Check your input')">Warning</button>
      <button class="btn btn-danger" (click)="toast.error('Something failed', { title: 'Error', timeOut: 0 })">Error (sticky)</button>
      <button class="btn btn-outline-secondary" (click)="toast.clear()">Clear</button>
    </div>
  </div>
</div>
<app-toast-container></app-toast-container>
