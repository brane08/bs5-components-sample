<div class="toast-container position-fixed p-3" [class]="'toast-container position-fixed p-3 pos-' + service.position()"
     aria-live="polite" aria-atomic="true">
  @for (toast of service.toasts(); track toast.id) {
    <div class="toast show border-0 text-bg-{{ toast.type }}" [attr.role]="toast.type === 'danger' ? 'alert' : 'status'">
      <div class="d-flex">
        <div class="toast-body">
          @if (toast.title) {
            <strong class="d-block">{{ toast.title }}</strong>
          }
          {{ toast.message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"
                (click)="service.remove(toast.id)"></button>
      </div>
    </div>
  }
</div>
