<div class="ms-control form-control d-flex align-items-center flex-wrap gap-1" [class.disabled]="disabled"
     [class.focused]="open()" (click)="openPanel(); input.focus()">
  @for (item of selectedItems; track label(item)) {
    <span class="badge bg-{{ type }} d-inline-flex align-items-center">
      <span class="me-1">{{ label(item) }}</span>
      <button type="button" class="btn-close btn-close-white" [attr.aria-label]="'Remove ' + label(item)"
              [disabled]="disabled" (click)="removeItem(item, $event)"></button>
    </span>
  }
  <input #input class="ms-input flex-grow-1" type="text" role="combobox" aria-haspopup="listbox"
         [attr.aria-expanded]="open()" [readOnly]="!searchable" [disabled]="disabled"
         [placeholder]="selected.length ? '' : placeholder" [value]="search()"
         (input)="onSearch($event)" (keydown)="onKeydown($event)" (focus)="openPanel()">
  @if (selected.length && !disabled) {
    <button type="button" class="btn-close ms-auto" aria-label="Clear all" (click)="clear($event)"></button>
  }
</div>
@if (open()) {
  <ul class="ms-panel list-group shadow-sm" role="listbox" aria-multiselectable="true">
    @for (item of filtered; track label(item); let i = $index) {
      <li class="list-group-item list-group-item-action d-flex align-items-center" role="option"
          [class.active-row]="i === active()" [class.disabled]="isDisabledItem(item)"
          [attr.aria-selected]="isSelected(item)" (mousedown)="$event.preventDefault()"
          (click)="toggle(item)" (mouseenter)="active.set(i)">
        <input class="form-check-input me-2 mt-0" type="checkbox" tabindex="-1" [checked]="isSelected(item)"
               [disabled]="isDisabledItem(item)" (click)="$event.preventDefault()">
        {{ label(item) }}
      </li>
    } @empty {
      <li class="list-group-item text-muted">No items found</li>
    }
  </ul>
}
