<!-- All positions stay rendered so leave animations of the last toast are not cut off. -->
@for (group of groups(); track group.position) {
  <div class="toast-container position-fixed p-3" [class]="group.classes" [attr.data-position]="group.position">
    @for (toast of group.toasts; track track(toast); let last = $last) {
      <!-- Bootstrap's toast spacing variable lives on .toast, so the wrapper gets the matching mb-4 utility. -->
      <div class="toast-slot" [class.mb-4]="!last"
           (animate.enter)="fadeIn($event, toast)" (animate.leave)="fadeOut($event, toast)">
        <ng-container *ngComponentOutlet="toast.config.toastComponent; injector: toast.injector" />
      </div>
    }
  </div>
}
